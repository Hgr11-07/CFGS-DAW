<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Inscripción: Obras Reales en Egipto</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        max-width: 600px;
        color: #1c1917;
      }
      fieldset {
        border: 1px solid #d97706;
        padding: 1rem;
      }
      legend {
        font-weight: bold;
      }
      label {
        display: block;
        margin-top: 0.7rem;
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <p><a href="index.html">← Inicio</a></p>
    <h1>Registro de Escribas y Maestros de Obra</h1>

    <form action="#" aria-describedby="ayuda-nivel">
      <fieldset>
        <legend>Ficha de reclutamiento para el Faraón</legend>

        <label
          >Nombre del artesano:
          <input type="text" name="nombre" required />
        </label>

        <label
          >Correo del nomo / contacto:
          <input type="email" name="email" required />
        </label>

        <label
          >Fecha de arribo tras la crecida del Nilo:
          <input type="date" name="fecha" required />
        </label>

        <p>Destino de asignación imperial:</p>
        <label
          ><input type="radio" name="destino" value="guiza" required />
          Pirámides de Guiza</label
        >
        <label
          ><input type="radio" name="destino" value="karnak" required /> Templo
          de Karnak</label
        >

        <label
          >Pericia en jeroglífico y cantería (1 aprendiz – 10 maestro):
          <input
            type="range"
            name="nivel"
            min="1"
            max="10"
            value="5"
            aria-describedby="ayuda-nivel"
          />
        </label>
        <small id="ayuda-nivel"
          >Indica tu grado de destreza reconocido por los sacerdotes.</small
        >

        <label>
          <input type="checkbox" name="raciones" /> Aportar raciones de trigo y
          cerveza para la travesía
        </label>
      </fieldset>

      <button type="submit">Presentar credenciales al Visir</button>
    </form>
  </body>
</html>
