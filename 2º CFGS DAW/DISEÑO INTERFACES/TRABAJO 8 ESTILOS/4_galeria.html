<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ingeniería del Imperio Romano</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; color: #1f2937; }
    .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    figure { margin: 0; border: 1px solid #b91c1c; padding: 0.5rem; }
    figcaption { text-align: center; }
  </style>
</head>
<body>
  <p><a href="index.html">← Inicio</a></p>
  <h1>Hitos de la Ingeniería Romana</h1>

  <section class="grid">
    <figure>
      <img src="coliseo.jpg" alt="Coliseo Romano" width="100%" />
      <figcaption>Anfiteatro Flavio: espectáculos masivos de gladiadores</figcaption>
    </figure>
    <figure>
      <img src="acueducto.jpg" alt="Acueducto Romano" width="100%" />
      <figcaption>Acueducto: transporte de agua mediante arquerías de sillería</figcaption>
    </figure>
    <figure>
      <img src="panteon.jpg" alt="Panteón de Agripa" width="100%" />
      <figcaption>Panteón de Agripa: cúpula de hormigón puzolánico con óculo</figcaption>
    </figure>
    <figure>
      <img src="termas.jpg" alt="Termas Romanas" width="100%" />
      <figcaption>Termas públicas: baños calefactados con hipocausto</figcaption>
    </figure>
    <figure>
      <img src="calzada.jpg" alt="Calzada Romana" width="100%" />
      <figcaption>Vía Apia: red de calzadas que vertebró el comercio y las legiones</figcaption>
    </figure>
    <figure>
      <img src="foro.jpg" alt="Foro Romano" width="100%" />
      <figcaption>Foro Romano: centro neurálgico de la ley y la política</figcaption>
    </figure>
  </section>
</body>
</html>
