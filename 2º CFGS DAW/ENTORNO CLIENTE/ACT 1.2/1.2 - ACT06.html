<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Saludos</title>
</head>
<body>
  <h1>Elige un idioma</h1>

  <button onclick="escribirDocumentoEntero('Привет!')">Ruso</button>
  <button onclick="escribirDocumentoEntero('¡Hola!')">Español</button>
  <button onclick="escribirDocumentoEntero('Hello!')">Inglés</button>

</body>
<script>

function escribirDocumentoEntero(mensaje){
  <!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>Saludos</title>
  </head>
  <body>
    <h1>Elige un idioma</h1>
    <button onclick="escribirDocumentoEntero('Привет!', document.write(`<p>${mensaje}</p>`);)">Ruso</button>
    <button onclick="escribirDocumentoEntero('¡Hola!', document.write(`<p>${mensaje}</p>`);)">Español</button>
    <button onclick="escribirDocumentoEntero('Hello!', document.write(`<p>${mensaje}</p>`);)">Inglés</button>
  </body>
}

</script>
</html>
