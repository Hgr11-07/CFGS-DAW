<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de control</title>
</head>
<body>
  <h1>Panel de control</h1>
  <p id="Estado">Sistema en espera</p>

  <button onclick="console.log('Hora del sistema: ' + new Date().toLocaleTimeString())">Consola</button>

  <button onclick="document.getElementById('Estado').innerHTML = 'Sistema Activo'; document.getElementById('Estado').style.backgroundColor = 'green'">Estilo</button>

  <button onclick="window.alert('El proceso ha concluido')">Alerta</button>
</body>
</html>
