<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Saludos</title>
</head>
<body>
  <h1>Elige un idioma</h1>
  <p>Abre la consola del desarrollador (F12) y pulsa un botón.</p>

  <button type="button" onclick="console.log('%cПривет!', 'color: crimson; font-size: 16px')">
    Ruso
  </button>

  <button type="button" onclick="console.log('%c¡Hola!', 'color: darkorange; font-size: 16px')">
    Español
  </button>

  <button type="button" onclick="console.log('%cHello!', 'color: royalblue; font-size: 16px')">
    Inglés
  </button>
</body>
</html>
