<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Saludos</title>
</head>
<body>
  <h1>Elige un idioma</h1>
  <p id="saludo">Pulsa un botón para ver el saludo.</p>


  <button type="button" onclick="
    document.getElementById('saludo').innerHTML = 'Привет!';
    document.getElementById('saludo').style.color = 'crimson';">
    Ruso
  </button>


  <button type="button" onclick="
    document.getElementById('saludo').innerHTML = '¡Hola!';
    document.getElementById('saludo').style.color = 'darkorange';">
    Español
  </button>


  <button type="button" onclick="
    document.getElementById('saludo').innerHTML = 'Hello!';
    document.getElementById('saludo').style.color = 'royalblue';">
    Inglés
  </button>
</body>
</html>
