<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Secuencia de imágenes</title>
</head>
<body>
  <h1>Haz clic en la imagen</h1>

  <img id="img" src="https://placehold.co/300x200?text=1" style="cursor:pointer" onclick="
    if (img.src.match('text=1')) { ponerImagen(2); }
    else if (img.src.match('text=2')) { ponerImagen(3); }
    else if (img.src.match('text=3')) { ponerImagen(4); }
    else { ponerImagen(1); }">
</body>

<script>

  const ponerImagen = (num) => {
    const img = document.getElementById('img');
    img.src = 'https://placehold.co/300x200?text=' + num;
  };

</script>

</html>
