<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Saludos</title>
</head>
<body>
  <h1>Elige un idioma</h1>
  <p>Abre la consola del desarrollador (F12) y pulsa un botón.</p>

  <button type="button" onclick="mensajeConsola('Привет!')">
    Ruso
  </button>

  <button type="button" onclick="mensajeConsola('¡Hola!')">
    Español
  </button>

  <button type="button" onclick="mensajeConsola('Hello!')">
    Inglés
  </button>
</body>
<script>
  const mensajeConsola = (mensaje) => {
    console.log(mensaje);
  };
</script>
</html>
